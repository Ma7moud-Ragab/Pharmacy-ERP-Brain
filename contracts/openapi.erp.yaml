# =============================================================================
# Pharmacy ERP — ERP Frontend/POS OpenAPI Contract
# Owner: erp-frontend
# =============================================================================
# Derived from: ERP-Backend-Blueprint-v1.1.md (backend team spec)
#
# Audience: Frontend team (POS web client, admin/back-office web client).
# Scope: this file is the ERP Frontend/POS HTTP surface only. Canonical
# /api/v1/canonical/* and internal /api/v1/sync/* endpoints are out of scope;
# they belong to the external Brain/AI and branch-replication boundaries and
# are specified separately. This file is not the complete ERP master contract.
#
# Conventions (binding):
#  - All routes versioned under /api/v1
#  - All mutations require header: Idempotency-Key, except login and
#    refresh-token rotation (Blueprint 8.9.2)
#  - Reads accept the standard W3C traceparent header; it is transport
#    metadata and is intentionally not modeled as a per-operation parameter
#  - Errors use the single ApiError envelope; each code maps to exactly one
#    HTTP status (400/401/403/404/409/410/422/500)
#  - Tenant (organization_id) ALWAYS derives from the JWT, never a request body
#    or query field. Any client-supplied organization_id is ignored by the server.
#  - Server is authoritative for: prices, tax rates, totals, change due,
#    inventory availability, allocation (FEFO), state transitions.
#    FE-supplied totals are informational only.
#  - Runtime ownership: endpoints tagged x-runtime Cloud | BranchLocal | Both.
#    "Both" = served by either runtime (shared Stage-1 surface). Asking a
#    runtime for a route it does not own returns 404/405 — the FE must treat
#    the route table below as runtime-qualified.
#  - Each operation is annotated x-stage: 1|2|3 (cumulative release stages).
# =============================================================================
openapi: 3.0.3
info:
  title: Pharmacy ERP API — ERP Frontend/POS Contract
  version: "1.0.0"
  description: |
    Frontend/POS-facing contract for the Pharmacy ERP backend MVP.

    Contract perimeter: this document covers only the ERP Frontend/POS HTTP
    surface. Canonical `/api/v1/canonical/*` and internal `/api/v1/sync/*`
    endpoints are deliberately excluded and are specified separately; they are
    not missing routes from this contract.

    Two runtime modes deploy this API surface:
      - ERP_RUNTIME_MODE=Cloud      — consolidation API
      - ERP_RUNTIME_MODE=BranchLocal — branch POS API (offline-capable)

    Stages are cumulative: Stage 1 must ship before Stage 2, Stage 2 before 3.
servers:
  - url: https://{host}/api/v1
    variables:
      host:
        default: erp.example.com
        description: Cloud API host (or branch-local LAN host for POS deploy)

tags:
  - name: Auth
    description: Authentication, token rotation, current-user context (Stage 1)
  - name: Organization
    description: Provisioning + organization management (Stage 1)
  - name: Branch
    description: Branch management + branch runtime enrollment (Stage 1)
  - name: Users
    description: Admin-only user administration (Stage 1)
  - name: Employees
    description: Employee management (Stage 1)
  - name: Catalog
    description: Categories, products, UOMs, reorder rules (Stage 1)
  - name: Inventory
    description: Locations, batches, balances, ledger, adjustments (Stage 1)
  - name: Sales
    description: POS orders, invoices, returns, refunds (Stage 2, BranchLocal)
  - name: Purchasing
    description: Suppliers, POs, receiving, payments, vendor returns (Stage 3)

paths:
  # ===========================================================================
  # AUTH (Stage 1)
  # ===========================================================================
  /auth/login:
    post:
      tags: [Auth]
      operationId: authLogin
      summary: Authenticate and issue access/refresh tokens
      description: |
        Resolves Organization by unique `organization_code`, then the user by
        (organization_id, normalized_username). The issued access token embeds
        the full trusted scope (roles, organization_id, branch_scope,
        branch_ids). Branch-local tokens are constrained to the enrolled
        branch and have max validity 24h.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens + current user context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-runtime: Both
      x-stage: 1

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: authRefresh
      summary: Rotate refresh token (rotation on every use)
      description: >
        Submit the current refresh token; receive a new family token pair.
        A reused (already-consumed) refresh token revokes its whole token
        family — the FE must then force re-login.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshTokenRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPairResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-runtime: Both
      x-stage: 1

  /auth/logout:
    post:
      tags: [Auth]
      operationId: authLogout
      summary: Revoke current refresh-token family
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogoutRequest" }
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Family revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin, Pharmacist, Cashier]
      x-required-scopes: []
      x-runtime: Both
      x-stage: 1

  /auth/me:
    get:
      tags: [Auth]
      operationId: authMe
      summary: Current authenticated context (trusted scope)
      security:
        - bearerAuth: []
      responses:
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Current user + organization + branch scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentUserContextDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin, Pharmacist, Cashier]
      x-required-scopes: []
      x-runtime: Both
      x-stage: 1

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: Public JWKS (RS256) for access-token signature validation
      description: |
        JSON Web Key Set of RS256 public signing keys (kid-keyed). Served at
        the API host root, outside the /api/v1 base path. The FE validates
        access tokens against these keys locally.
      servers:
        - url: https://{host}
          variables:
            host:
              default: erp.example.com
              description: Cloud or branch-local API host (root, without /api/v1)
      security: []
      x-runtime: Both
      x-stage: 1
      responses:
        "200":
          description: Active RS256 public keys
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JwksResponse" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ===========================================================================
  # ORGANIZATION (Stage 1)
  # ===========================================================================
  /organizations:
    post:
      tags: [Organization]
      operationId: createOrganization
      summary: PlatformProvisioner-only atomic tenant creation
      description: |
        Requires the deployment-only PlatformProvisioner credential (not a
        normal tenant user session). Atomically creates Organization, first
        Branch, first Employee, and first Admin account. Seeds one SELLABLE,
        one QUARANTINE, one SCRAP location for the branch.
      security:
        - platformProvisioner: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrganizationRequest" }
      responses:
        "409": { $ref: "#/components/responses/Conflict" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Created organization + initial admin context + enrollment setup state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSetupResultDto" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [PlatformProvisioner]
      x-required-scopes: []
      x-runtime: Cloud
      x-stage: 1

  # ===========================================================================
  # BRANCHES (Stage 1)
  # ===========================================================================
  /branches:
    get:
      tags: [Branch]
      operationId: listBranches
      summary: List branches (organization-scoped)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/includeInactive"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Paged branches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedBranchDto"
        "403": { $ref: "#/components/responses/ForbiddenBranch" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: []
      x-runtime: Both
      x-stage: 1
    post:
      tags: [Branch]
      operationId: createBranch
      summary: Create branch (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Created branch (locations are auto-seeded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDto" }
        "403": { $ref: "#/components/responses/ForbiddenBranch" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: []
      x-runtime: Cloud
      x-stage: 1

  /branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/branchId"
    get:
      tags: [Branch]
      operationId: getBranch
      summary: Branch detail (organization-scoped)
      security:
        - bearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Branch detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDto" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: []
      x-runtime: Both
      x-stage: 1
    patch:
      tags: [Branch]
      operationId: patchBranch
      summary: Update branch name/timezone (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchPatchRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Updated branch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchDto" }
        "403": { $ref: "#/components/responses/ForbiddenBranch" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: []
      x-runtime: Cloud
      x-stage: 1

  /branches/{branchId}/enrollment-tokens:
    post:
      tags: [Branch]
      operationId: createBranchEnrollmentToken
      summary: Admin issues single-use short-lived branch enrollment token
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/branchId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: Enrollment token (single use, expiring)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnrollmentTokenDto" }
        "403": { $ref: "#/components/responses/ForbiddenBranch" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: []
      x-runtime: Cloud
      x-stage: 1

  /branch-enrollment:
    post:
      tags: [Branch]
      operationId: redeemBranchEnrollment
      summary: Branch runtime redeems enrollment token
      description: |
        Redeems a single-use token; returns organization_id, branch_id,
        runtime credential, initial sync cursor, and credential expiry.
        Served by Cloud because enrollment tokens are stored hashed in the
        cloud identity store; the branch runtime calls this cloud endpoint
        over the authenticated bootstrap channel.
      security: []
      x-required-roles: []
      x-required-scopes: []
      x-runtime: Cloud
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BranchEnrollmentRequest" }
      responses:
        "200":
          description: Runtime credential + initial cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BranchEnrollmentResultDto" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "410": { $ref: "#/components/responses/Gone" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-stage: 1

  # ===========================================================================
  # USERS (Stage 1, Admin-only)
  # ===========================================================================
  /users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: Paged users
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedUserDto" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Both
      x-stage: 1
    post:
      tags: [Users]
      operationId: createUser
      summary: Create user (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/userId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user (Admin only)
      security:
        - bearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: User detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Both
      x-stage: 1
    patch:
      tags: [Users]
      operationId: patchUser
      summary: Update role/access/active (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatchRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserDto" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  /users/{userId}/password-reset:
    post:
      tags: [Users]
      operationId: resetUserPassword
      summary: Admin password reset (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "204": { description: Password reset }
        "422": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  /users/{userId}/revoke-sessions:
    post:
      tags: [Users]
      operationId: revokeUserSessions
      summary: Revoke all refresh-token families (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/userId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "204": { description: Sessions revoked }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  # ===========================================================================
  # EMPLOYEES (Stage 1)
  # ===========================================================================
  /employees:
    get:
      tags: [Employees]
      operationId: listEmployees
      summary: List employees (branch-scoped)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/branchIdQuery"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Paged employees
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedEmployeeDto" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Both
      x-stage: 1
    post:
      tags: [Employees]
      operationId: createEmployee
      summary: Create employee (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Created employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeDto" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  /employees/{employeeId}:
    parameters:
      - $ref: "#/components/parameters/employeeId"
    get:
      tags: [Employees]
      operationId: getEmployee
      summary: Get employee detail
      security:
        - bearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Employee detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeDto" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Both
      x-stage: 1
    patch:
      tags: [Employees]
      operationId: patchEmployee
      summary: Update employee (Admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeePatchRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Updated employee
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeDto" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
      x-required-roles: [Admin]
      x-required-scopes: [user:admin]
      x-runtime: Cloud
      x-stage: 1

  # ===========================================================================
  # PRODUCT CATEGORIES (Stage 1)
  # ===========================================================================
  /product-categories:
    get:
      tags: [Catalog]
      operationId: listProductCategories
      summary: List product categories (tree via parent_category_id)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/includeInactive"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
