      operationId: postInventoryAdjustmentById
      summary: Post a DRAFT adjustment; use POST /inventory/adjustments for reversals
      description: |
        Commits this DRAFT adjustment. Posted transactions and lines are
        immutable; corrections and reversals are new transactions created via
        POST /inventory/adjustments with transaction_type=REVERSAL and
        reverses_inventory_txn_id.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
