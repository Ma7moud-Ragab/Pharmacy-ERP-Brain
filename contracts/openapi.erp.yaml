            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrderDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /purchase-orders/{purchaseOrderId}/approve:
    post:
      tags: [Purchasing]
      operationId: approvePurchaseOrder
      summary: DRAFT → APPROVED
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [purchase-order:approve]
      x-runtime: Cloud
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/purchaseOrderId"
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Approved PO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrderDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /purchase-orders/{purchaseOrderId}/order:
    post:
      tags: [Purchasing]
      operationId: orderPurchaseOrder
      summary: APPROVED → ORDERED (ordered quantities and terms become immutable)
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [purchase-order:approve]
      x-runtime: Cloud
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/purchaseOrderId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderPurchaseOrderRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Ordered PO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrderDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /purchase-orders/{purchaseOrderId}/receive:
    post:
      tags: [Purchasing]
      operationId: receivePurchaseOrder
      summary: |
        One-step partial receiving. Validates the full request, creates
        InventoryBatch (UUIDv5 deterministic), ledger txn + lines, updates
        received/rejected cumulative fields, balance, and moving average —
        all atomically. Idempotent; same key cannot post twice.
        Expired lots rejected for sellable; shelf-life policy enforced,
        exception role-guarded with reason.
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [purchase-order:receive]
      x-runtime: BranchLocal
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/purchaseOrderId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReceivePurchaseOrderRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Receipt result + inventory txn refs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseReceiptResultDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: EXPIRY_POLICY_VIOLATION / shelf-life / quantity policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /purchase-orders/{purchaseOrderId}/cancel-remaining:
    post:
      tags: [Purchasing]
      operationId: cancelPurchaseOrderRemaining
      summary: |
        BranchLocal-only close of remaining obligation (reason + key); PO
        transitions to CLOSED when no uncancelled quantity remains; emits
        CANCEL_REMAINING_PURCHASE_ORDER fact to cloud.
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [purchase-order:receive]
      x-runtime: BranchLocal
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/purchaseOrderId"
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelPurchaseOrderRemainingRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: CLOSED PO
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseOrderDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ===========================================================================
  # SUPPLIER PAYMENTS (Stage 3, Cloud)
  # ===========================================================================
  /supplier-payments:
    post:
      tags: [Purchasing]
      operationId: createSupplierPayment
      summary: |
        Order-level cash settlement against PO commitment. Not AP ledger, no
        supplier-invoice match. Only for APPROVED/ORDERED/PARTIALLY_RECEIVED/
        RECEIVED/CLOSED POs with positive outstanding; amount ≤ outstanding;
        currency must match PO (which equals base_currency).
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [supplier-payment:write]
      x-runtime: Cloud
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordSupplierPaymentRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Posted payment + updated PO payment status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPaymentDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /supplier-payments/{supplierPaymentId}:
    get:
      tags: [Purchasing]
      operationId: getSupplierPayment
      summary: Get supplier payment detail
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [purchase-order:read]
      x-runtime: Cloud
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/supplierPaymentId"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Payment detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupplierPaymentDto" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ===========================================================================
  # VENDOR RETURNS (Stage 3)
  # ===========================================================================
  /vendor-returns:
    get:
      tags: [Purchasing]
      operationId: listVendorReturns
      summary: List vendor returns (branch-scoped)
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [return:read]
      x-runtime: Both
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/cursor"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/branchIdQuery"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/VendorReturnStatus" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Paged vendor returns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedVendorReturnDto" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      tags: [Purchasing]
      operationId: createVendorReturn
      summary: Create DRAFT return (lines reference PO line + batch + location)
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [return:write]
      x-runtime: BranchLocal
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateVendorReturnRequest" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "201":
          description: Draft vendor return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorReturnDto" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /vendor-returns/{vendorReturnId}:
    parameters:
      - $ref: "#/components/parameters/vendorReturnId"
    get:
      tags: [Purchasing]
      operationId: getVendorReturn
      summary: Get vendor return detail
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [return:read]
      x-runtime: Both
      x-stage: 3
      security:
        - bearerAuth: []
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Return + lines + linked inventory txn
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorReturnDto" }
        "404": { $ref: "#/components/responses/NotFound" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /vendor-returns/{vendorReturnId}/cancel:
    parameters:
      - $ref: "#/components/parameters/vendorReturnId"
    post:
      tags: [Purchasing]
      operationId: cancelVendorReturn
      summary: DRAFT-only cancel
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [return:write]
      x-runtime: BranchLocal
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Cancelled return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorReturnDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  /vendor-returns/{vendorReturnId}/post:
    parameters:
      - $ref: "#/components/parameters/vendorReturnId"
    post:
      tags: [Purchasing]
      operationId: postVendorReturn
      summary: |
        Posts vendor return, producing a negative VENDOR_RETURN_OUT ledger
        transaction, updating balances/cost. Batch quantity cannot exceed
        accepted received stock still available.
      x-required-roles: [Admin, Pharmacist]
      x-required-scopes: [return:write]
      x-runtime: BranchLocal
      x-stage: 3
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/idempotencyKey"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "200":
          description: Posted return
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VendorReturnDto" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "400": { $ref: "#/components/responses/MalformedRequest" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ===========================================================================
  # NOTES ON NON-FRONTEND ENDPOINTS (excluded from this contract):
  #
  # /api/v1/canonical/*        — external Brain/AI boundary, not consumed by FE
  # /api/v1/sync/operations    — internal local→cloud push, service identity
  # /api/v1/sync/bootstrap     — internal branch enrollment bootstrap
  # /api/v1/sync/changes       — internal branch cursor feed
  # /api/v1/sync/operations/{id}/retry — admin-only sync retry, cloud; scoped
  #        to sync administrators via sync:retry scope. No FE surface in MVP.
  #
  # A branch-local FE calling a cloud-only route (e.g. /suppliers) gets
  # 404/405; the FE must branch on the declared runtime mode (see README).
  # ===========================================================================

components:
  # ===========================================================================
  # SECURITY SCHEMES
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        User JWT (RS256, JWKS-validated). Claims: sub, roles,
        organization_id, branch_scope, branch_ids, scopes.
    platformProvisioner:
      type: http
      scheme: bearer
      description: Deployment-only credential for POST /organizations.

  # ===========================================================================
  # REUSABLE PARAMETERS
  # ===========================================================================
  parameters:
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        Stable per-mutation key (UUID or opaque, max 100 chars). Same key with
        same payload hash replays the original stored response; same key with
        a DIFFERENT payload → 409 IDEMPOTENCY_MISMATCH.
      schema: { type: string, minLength: 16, maxLength: 100 }
    cursor:
      name: cursor
      in: query
      description: Opaque continuation cursor from a previous PagedResult response.
      schema: { type: string, maxLength: 500 }
    limit:
      name: limit
      in: query
      description: Page size (server-defined default and max).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    includeInactive:
      name: includeInactive
      in: query
      description: Include soft-deactivated (is_active=false) master data in list results.
      schema: { type: boolean, default: false }
    branchIdQuery:
      name: branchId
      in: query
      schema: { type: string, format: uuid }
      description: Optional branch filter; must be within caller branch scope.
    branchIdQueryRequired:
      name: branchId
      in: query
      required: true
      schema: { type: string, format: uuid }
      description: Required branch filter; must be within caller branch scope.
    branchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    userId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    employeeId:
      name: employeeId
      in: path
      required: true
      schema: { type: string, format: uuid }
    categoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }
    productId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    uomId:
      name: uomId
      in: path
      required: true
      schema: { type: string, format: uuid }
    locationId:
      name: locationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    txnId:
      name: txnId
      in: path
      required: true
      schema: { type: string, format: uuid }
    salesOrderId:
      name: salesOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    invoiceId:
      name: invoiceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    returnId:
      name: returnId
      in: path
      required: true
      schema: { type: string, format: uuid }
    supplierId:
      name: supplierId
      in: path
      required: true
      schema: { type: string, format: uuid }
    purchaseOrderId:
      name: purchaseOrderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    supplierPaymentId:
      name: supplierPaymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    vendorReturnId:
      name: vendorReturnId
      in: path
      required: true
      schema: { type: string, format: uuid }

  # ===========================================================================
  # REUSABLE RESPONSES
  # ===========================================================================
  responses:
    Unauthorized:
      description: Missing/invalid/expired token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: Authenticated but not permitted
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ForbiddenBranch:
      description: |
        Actor authenticated but lacks branch access. Errors shall use code
        FORBIDDEN_BRANCH when branch scope is the failing check.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Gone:
      description: Resource/token is expired, consumed, or no longer available
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: Resource not in scope or does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Conflict:
      description: State / sequence / idempotency / stock conflict
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    ValidationError:
      description: Well-formed but field/domain validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    MalformedRequest:
      description: Malformed or unparseable request (MALFORMED_REQUEST)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    InternalError:
      description: Unexpected server error (INTERNAL_ERROR)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }

  # ===========================================================================
  # SCHEMAS
  # ===========================================================================
  schemas:

    # -------------------------------------------------------------------------
    # Common / shared
    # -------------------------------------------------------------------------
    Money:
      type: string
      pattern: '^\d{1,16}(\.\d{1,2})?$'
      description: |
        Non-negative monetary amount serialized as a plain decimal string to
        preserve numeric(18,2) precision exactly. Never use IEEE-754 floats for
        money on FE; treat this as a fixed-2-decimal string. Amounts that must
        be strictly positive add a >0 rule at the owning field.
      example: "1250.00"

    Numeric4:
      type: string
      pattern: '^-?\d{1,14}(\.\d{1,4})?$'
      description: Signed numeric(18,4) serialized as fixed-4 decimal string; use only for signed ledger deltas.

    NonNegativeNumeric4:
      type: string
      pattern: '^\d{1,14}(\.\d{1,4})?$'
      description: Non-negative numeric(18,4) quantity or unit cost.

    PositiveNumeric4:
      type: string
      pattern: '^(?!0+(\.0{1,4})?$)\d{1,14}(\.\d{1,4})?$'
      description: Strictly positive numeric(18,4) quantity.

    Numeric6:
      type: string
      pattern: '^-?\d{1,12}(\.\d{1,6})?$'
      description: Signed numeric(18,6) serialized as fixed-6 decimal string.

    PositiveNumeric6:
      type: string
      pattern: '^(?!0+(\.0{1,6})?$)\d{1,12}(\.\d{1,6})?$'
      description: Strictly positive numeric(18,6) conversion factor; conversion must be >0.

    PositiveMoney:
      type: string
      pattern: '^(?!0+(\.0{1,2})?$)\d{1,16}(\.\d{1,2})?$'
      description: Strictly positive monetary amount (numeric(18,2)) for amounts that cannot be zero.

    TaxRate:
      type: string
      pattern: '^(0|0\.\d{1,4}|1(\.0{1,4})?)$'
      description: Fractional tax rate numeric(9,4); 0.1400 = 14%.

    Timestamp:
      type: string
      format: date-time
      description: UTC timestamptz ISO 8601 (suffix Z).

    Uuid:
      type: string
      format: uuid

    Role:
      type: string
      enum: [Admin, Pharmacist, Cashier]
      description: Case-sensitive closed set.

    BranchScope:
      type: string
      enum: [ALL, ASSIGNED]
      description: ALL only permitted for Admin (DB CHECK enforces).

    PermissionScope:
      type: string
      enum:
        - inventory:read
        - inventory:write
        - sales:read
        - sales:write
        - return:read
        - return:write
        - purchase-order:read
        - purchase-order:draft
        - purchase-order:approve
        - purchase-order:receive
        - supplier-payment:write
        - sync:retry
        - user:admin
      description: Authorization vocabulary; endpoint policy + resource state remain authoritative.

    RuntimeMode:
      type: string
      enum: [Cloud, BranchLocal]
      description: Which runtime deployment the FE is currently talking to.

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Exactly ONE canonical HTTP status per code. Closed set:
                MALFORMED_REQUEST(400), UNAUTHORIZED(401),
                FORBIDDEN(403), FORBIDDEN_BRANCH(403),
                NOT_FOUND(404), CONFLICT(409),
                INVALID_STATE_TRANSITION(409),
                OUT_OF_STOCK(409), IDEMPOTENCY_MISMATCH(409),
                GONE(410),
                VALIDATION_ERROR(422), EXPIRY_POLICY_VIOLATION(422),
                INTERNAL_ERROR(500).
              enum:
                - MALFORMED_REQUEST
                - UNAUTHORIZED
                - FORBIDDEN
                - FORBIDDEN_BRANCH
                - NOT_FOUND
                - CONFLICT
                - INVALID_STATE_TRANSITION
                - OUT_OF_STOCK
                - IDEMPOTENCY_MISMATCH
                - GONE
                - VALIDATION_ERROR
                - EXPIRY_POLICY_VIOLATION
                - INTERNAL_ERROR
            message:
              type: string
              description: Human-readable; safe to display to user.
            details:
              type: array
              description: Field-level issues (presence optional).
              items:
                type: object
                required: [issue]
                properties:
                  field: { type: string, description: 'JSON path e.g. "lines[0].quantity"' }
                  issue: { type: string }
            trace_id:
              type: string
              description: Matches the W3C traceparent propagated in the call.

    PagedResult:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          description: Page items; conforms to item-specific subclass contract.
        nextCursor:
          nullable: true
          type: string
          description: Opaque; null means end of results. Use nextCursor in next
            call's `cursor` query param.

    # -------------------------------------------------------------------------
    # JWKS
    # -------------------------------------------------------------------------
    JwksResponse:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, n, e]
            properties:
              kty: { type: string, enum: [RSA] }
              kid: { type: string }
              use: { type: string, enum: [sig] }
              alg: { type: string, enum: [RS256] }
              n: { type: string, description: Base64url-encoded RSA modulus }
              e: { type: string, description: Base64url-encoded RSA public exponent }

    # -------------------------------------------------------------------------
    # Auth
    # -------------------------------------------------------------------------
    LoginRequest:
      type: object
      required: [organization_code, username, password]
      properties:
        organization_code:
          type: string
          maxLength: 30
          description: Unique per Organization — used to scope username uniqueness.
        username:
          type: string
          maxLength: 80
        password:
          type: string
          format: password
          maxLength: 128

    TokenPairResponse:
      type: object
      required: [access_token, refresh_token, expires_in, user, organization_id, branch_scope, branch_ids, issuer, audience, key_id]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in:
          type: integer
          description: Access-token lifetime in seconds; token_type usually Bearer.
          maximum: 86400
        token_type: { type: string, default: "Bearer" }
        user: { $ref: "#/components/schemas/UserDto" }
        organization_id: { $ref: "#/components/schemas/Uuid" }
        branch_scope: { $ref: "#/components/schemas/BranchScope" }
        branch_ids:
          type: array
          description: |
            Explicit authorized branches for the user. Empty array with
            branch_scope=ALL implies ALL organization branches.
          items: { $ref: "#/components/schemas/Uuid" }
        issuer: { type: string, description: iss value for JWT validation }
        audience: { type: string, description: aud value for JWT validation }
        key_id: { type: string, description: kid of the signing key used }

    LoginResponse:
      allOf:
        - $ref: "#/components/schemas/TokenPairResponse"

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string, nullable: true }

    CurrentUserContextDto:
      type: object
      required: [user, organization_id, organization_code, branch_scope, branch_ids, roles, scopes, runtime]
      properties:
        user: { $ref: "#/components/schemas/UserDto" }
        organization_id: { $ref: "#/components/schemas/Uuid" }
        organization_code: { type: string }
        branch_scope: { $ref: "#/components/schemas/BranchScope" }
        branch_ids:
          type: array
          items: { $ref: "#/components/schemas/Uuid" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/PermissionScope" }
        runtime: { $ref: "#/components/schemas/RuntimeMode" }

    # -------------------------------------------------------------------------
    # Identity
    # -------------------------------------------------------------------------
    AddressDto:
      type: object
      description: Flattened owned value object (EF address_ prefixed columns)
      required: [line1, city, country_code]
      properties:
        line1: { type: string, maxLength: 200 }
        line2: { type: string, nullable: true, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        region: { type: string, nullable: true, maxLength: 100 }
        postal_code: { type: string, nullable: true, maxLength: 20 }
        country_code: { type: string, minLength: 2, maxLength: 2 }

    OrganizationDto:
      type: object
      required: [organization_id, organization_code, name, base_currency, time_zone_id, is_active]
      properties:
        organization_id: { $ref: "#/components/schemas/Uuid" }
        organization_code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 150 }
        base_currency: { type: string, default: "EGP" }
        time_zone_id:
          type: string
          description: IANA TZ identifier e.g. "Africa/Cairo".
        address: { $ref: "#/components/schemas/AddressDto" }
        is_active: { type: boolean }

    CreateOrganizationRequest:
      type: object
      required: [organization_code, name, base_currency, time_zone_id, address, branch, admin]
      properties:
        organization_code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 150 }
        base_currency: { type: string, default: "EGP" }
        time_zone_id: { type: string, description: Validated against IANA registry }
        address: { $ref: "#/components/schemas/AddressDto" }
        branch:
          type: object
          required: [code, name, address]
          properties:
            code: { type: string, maxLength: 30 }
            name: { type: string, maxLength: 150 }
            address: { $ref: "#/components/schemas/AddressDto" }
        admin:
          type: object
          required: [employee_no, full_name, username, password]
          properties:
            employee_no: { type: string, maxLength: 30 }
            full_name: { type: string, maxLength: 150 }
            username: { type: string, maxLength: 80 }
            password: { type: string, format: password, maxLength: 128 }

    OrganizationSetupResultDto:
      type: object
      required: [organization, branch, employee, user, enrollment_setup_state]
      properties:
        organization: { $ref: "#/components/schemas/OrganizationDto" }
        branch: { $ref: "#/components/schemas/BranchDto" }
        employee: { $ref: "#/components/schemas/EmployeeDto" }
        user: { $ref: "#/components/schemas/UserDto" }
        enrollment_setup_state:
          type: string
          enum: [PENDING, ENROLLED, FAILED]

    BranchDto:
      type: object
      required: [branch_id, organization_id, code, name, is_active]
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        organization_id: { $ref: "#/components/schemas/Uuid" }
        code: { type: string, description: branch_code }
        name: { type: string }
        address: { $ref: "#/components/schemas/AddressDto" }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    BranchRequest:
      type: object
      required: [code, name, address]
      properties:
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 150 }
        address: { $ref: "#/components/schemas/AddressDto" }
        is_active:
          type: boolean
          default: true

    BranchPatchRequest:
      type: object
      description: Partial; server validates organization scope.
      properties:
        name: { type: string, maxLength: 150 }
        address: { $ref: "#/components/schemas/AddressDto" }
        is_active: { type: boolean }

    EnrollmentTokenDto:
      type: object
      required: [enrollment_id, token, expires_at]
      properties:
        enrollment_id: { $ref: "#/components/schemas/Uuid" }
        token:
          type: string
          description: Single-use opaque token; only this plain value leaves now (we store hash).
        expires_at: { $ref: "#/components/schemas/Timestamp" }

    BranchEnrollmentRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    BranchEnrollmentResultDto:
      type: object
      required: [organization_id, branch_id, runtime_credential, initial_cursor, credential_expires_at]
      properties:
        organization_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        runtime_credential:
          type: string
          format: password
        initial_cursor:
          type: string
          description: Opaque bootstrap cursor to store in branch-local DB.
        credential_expires_at:
          $ref: "#/components/schemas/Timestamp"

    EmployeeDto:
      type: object
      required: [employee_id, organization_id, branch_id, employee_no, full_name, address, hired_on, is_active]
      properties:
        employee_id: { $ref: "#/components/schemas/Uuid" }
        organization_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        employee_no: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 150 }
        email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        job_title: { type: string, nullable: true, maxLength: 80 }
        address: { $ref: "#/components/schemas/AddressDto" }
        hired_on: { type: string, format: date }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    EmployeeRequest:
      type: object
      required: [branch_id, employee_no, full_name, address, hired_on, is_active]
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        employee_no: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 150 }
        email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        job_title: { type: string, nullable: true, maxLength: 80 }
        address: { $ref: "#/components/schemas/AddressDto" }
        hired_on: { type: string, format: date }
        is_active: { type: boolean }

    EmployeePatchRequest:
      type: object
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        employee_no: { type: string, maxLength: 30 }
        full_name: { type: string, maxLength: 150 }
        email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        job_title: { type: string, nullable: true, maxLength: 80 }
        address: { $ref: "#/components/schemas/AddressDto" }
        hired_on: { type: string, format: date, nullable: true }
        is_active: { type: boolean }

    UserDto:
      type: object
      required: [user_id, employee_id, username, role, branch_scope, is_active]
      properties:
        user_id: { $ref: "#/components/schemas/Uuid" }
        employee_id: { $ref: "#/components/schemas/Uuid" }
        username: { type: string, maxLength: 80 }
        role: { $ref: "#/components/schemas/Role" }
        branch_scope: { $ref: "#/components/schemas/BranchScope" }
        is_active: { type: boolean }
        access_failed_count: { type: integer, readOnly: true }
        lockout_end:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
          readOnly: true
        last_login_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
          readOnly: true

    BranchAccessGrantDto:
      type: object
      required: [branch_id]
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        branch_code: { type: string, readOnly: true }

    CreateUserRequest:
      type: object
      required: [employee_id, username, password, role, branch_scope]
      properties:
        employee_id:
          $ref: "#/components/schemas/Uuid"
        username: { type: string, maxLength: 80 }
        password: { type: string, format: password, maxLength: 128 }
        role: { $ref: "#/components/schemas/Role" }
        branch_scope: { $ref: "#/components/schemas/BranchScope" }
        branch_access:
          type: array
          description: Required only when branch_scope=ASSIGNED.
          items: { $ref: "#/components/schemas/BranchAccessGrantDto" }

    UserPatchRequest:
      type: object
      description: Admin may change role, branch scope/access, and is_active. username unchanged (immutable).
      properties:
        role: { $ref: "#/components/schemas/Role" }
        branch_scope: { $ref: "#/components/schemas/BranchScope" }
        branch_access:
          type: array
          items: { $ref: "#/components/schemas/BranchAccessGrantDto" }
        is_active: { type: boolean }

    PasswordResetRequest:
      type: object
      required: [new_password]
      properties:
        new_password: { type: string, format: password, maxLength: 128 }

    # -------------------------------------------------------------------------
    # Catalog
    # -------------------------------------------------------------------------
    ProductCategoryDto:
      type: object
      required: [category_id, code, name, is_active]
      properties:
        category_id: { $ref: "#/components/schemas/Uuid" }
        parent_category_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 250 }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    ProductCategoryRequest:
      type: object
      required: [code, name]
      properties:
        parent_category_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 250 }
        is_active: { type: boolean, default: true }

    ProductCategoryPatchRequest:
      type: object
      properties:
        parent_category_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 250 }
        is_active: { type: boolean }

    ProductUomDto:
      type: object
      required: [product_uom_id, uom_code, display_name, conversion_to_base, is_base, is_sellable, is_purchasable, is_active]
      properties:
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        uom_code: { type: string, maxLength: 20 }
        display_name: { type: string, maxLength: 50 }
        conversion_to_base: { $ref: "#/components/schemas/PositiveNumeric6" }
        sale_unit_price:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
          description: "Required (non-null, >= 0) when is_sellable=true; the authoritative POS sale price. Optional and null when is_sellable=false."
        is_base: { type: boolean }
        is_sellable: { type: boolean }
        is_purchasable: { type: boolean }
        is_active: { type: boolean }

    ProductUomRequest:
      type: object
      required: [uom_code, display_name, conversion_to_base]
      properties:
        uom_code: { type: string, maxLength: 20 }
        display_name: { type: string, maxLength: 50 }
        conversion_to_base: { $ref: "#/components/schemas/PositiveNumeric6" }
        sale_unit_price:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
        is_base: { type: boolean, default: false }
        is_sellable: { type: boolean, default: false }
        is_purchasable: { type: boolean, default: false }

    ProductUomPatchRequest:
      type: object
      description: |
        Permitted non-historical attributes only (conversion_to_base and
        is_base become immutable once referenced by a posted document or
        stock). is_active=false to deactivate; never hard delete.
      properties:
        display_name: { type: string, maxLength: 50 }
        sale_unit_price:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
        is_sellable: { type: boolean }
        is_purchasable: { type: boolean }
        is_active: { type: boolean }

    ProductDto:
      type: object
      required: [product_id, category_id, sku, name, base_uom_code, tax_rate, lot_tracking_required, expiry_alert_days, is_active, uoms]
      properties:
        product_id: { $ref: "#/components/schemas/Uuid" }
        category_id: { $ref: "#/components/schemas/Uuid" }
        sku: { type: string, maxLength: 40 }
        barcode: { type: string, nullable: true, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        generic_name: { type: string, nullable: true, maxLength: 180 }
        brand_name: { type: string, nullable: true, maxLength: 180 }
        base_uom_code: { type: string, maxLength: 20 }
        tax_rate:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          description: Fractional 0..1
        image_url: { type: string, nullable: true, maxLength: 300 }
        lot_tracking_required: { type: boolean }
        expiry_alert_days: { type: integer, minimum: 0, maximum: 3650 }
        is_active: { type: boolean }
        uoms:
          type: array
          items: { $ref: "#/components/schemas/ProductUomDto" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    CreateProductRequest:
      type: object
      required: [category_id, sku, name, base_uom_code, uoms]
      properties:
        category_id: { $ref: "#/components/schemas/Uuid" }
        sku: { type: string, maxLength: 40 }
        barcode: { type: string, nullable: true, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        generic_name: { type: string, nullable: true, maxLength: 180 }
        brand_name: { type: string, nullable: true, maxLength: 180 }
        base_uom_code: { type: string, maxLength: 20 }
        tax_rate:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          default: "0.0000"
        image_url: { type: string, nullable: true, maxLength: 300 }
        lot_tracking_required: { type: boolean, default: false }
        expiry_alert_days: { type: integer, default: 0, minimum: 0, maximum: 3650 }
        uoms:
          type: array
          minItems: 1
          description: Must include exactly one is_base=true entry with conversion_to_base=1.
          items: { $ref: "#/components/schemas/ProductUomRequest" }

    ProductPatchRequest:
      type: object
      properties:
        category_id: { $ref: "#/components/schemas/Uuid" }
        barcode: { type: string, nullable: true, maxLength: 80 }
        name: { type: string, maxLength: 180 }
        generic_name: { type: string, nullable: true, maxLength: 180 }
        brand_name: { type: string, nullable: true, maxLength: 180 }
        tax_rate: { $ref: "#/components/schemas/TaxRate" }
        image_url: { type: string, nullable: true, maxLength: 300 }
        lot_tracking_required: { type: boolean, description: Cannot change while stock or posted ledger history exists. }
        expiry_alert_days: { type: integer, minimum: 0, maximum: 3650 }
        is_active: { type: boolean }

    ReorderRuleDto:
      type: object
      required: [reorder_rule_id, product_id, branch_id, reorder_point_base, reorder_quantity_base, is_active]
      properties:
        reorder_rule_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        reorder_point_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        reorder_quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        max_quantity_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
        is_active: { type: boolean }

    ReorderRuleRequest:
      type: object
      description: |
        Product and branch are taken from the path; they are not accepted in
        the body, so the path is the single source of truth.
      required: [reorder_point_base, reorder_quantity_base]
      properties:
        reorder_point_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        reorder_quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        max_quantity_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
        is_active: { type: boolean, default: true }

    # -------------------------------------------------------------------------
    # Inventory
    # -------------------------------------------------------------------------
    LocationType:
      type: string
      enum: [SELLABLE, QUARANTINE, SCRAP]
      description: >
        Only SELLABLE location_type may have is_sellable=true.
        QUARANTINE and SCRAP are always is_sellable=false.

    BatchQualityStatus:
      type: string
      enum: [AVAILABLE, QUARANTINED, EXPIRED, RECALLED]
      description: >
        Availability for sale further requires non-expired-by-date and an
        eligible SELLABLE location; the current date-eligibility check is
        independently evaluated even if stored quality value hasn't refreshed.

    InventoryLocationDto:
      type: object
      required: [location_id, branch_id, location_code, name, location_type, is_sellable, is_active]
      properties:
        location_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        location_code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        location_type: { $ref: "#/components/schemas/LocationType" }
        is_sellable: { type: boolean }
        is_active: { type: boolean }

    InventoryLocationRequest:
      type: object
      required: [branch_id, location_code, name, location_type]
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        location_code: { type: string, maxLength: 30 }
        name: { type: string, maxLength: 100 }
        location_type: { $ref: "#/components/schemas/LocationType" }
        is_active: { type: boolean, default: true }

    InventoryLocationPatchRequest:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        location_type: { $ref: "#/components/schemas/LocationType" }
        is_active: { type: boolean }

    InventoryBatchDto:
      type: object
      required: [batch_id, product_id, batch_number, quality_status]
      properties:
        batch_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Deterministic UUIDv5; identical across branches
        product_id: { $ref: "#/components/schemas/Uuid" }
        batch_number: { type: string, maxLength: 80, description: "Exact, case-sensitive" }
        manufactured_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        quality_status: { $ref: "#/components/schemas/BatchQualityStatus" }
        is_non_lot:
          type: boolean
          readOnly: true
          description: True for reserved batch_number=NON-LOT with NULL dates.

    InventoryBalanceDto:
      type: object
      required: [product_id, branch_id, location_id, batch_id, on_hand_qty_base, average_unit_cost, available_qty_base]
      properties:
        product_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        location_id: { $ref: "#/components/schemas/Uuid" }
        batch_id: { $ref: "#/components/schemas/Uuid" }
        on_hand_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: Always >= 0
        average_unit_cost: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        available_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: |
            Server-derived eligible quantity: sum of on_hand from sellable
            locations for batches that are AVAILABLE, not expired by business
            date, and not recalled. With no reservations in MVP this normally
            equals eligible on_hand, not raw on_hand across all locations.
            Never negative.
        row_version:
          type: integer
          format: int64
          readOnly: true
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    InventoryTxnType:
      type: string
      enum:
        - OPENING_BALANCE
        - ADJUSTMENT_IN
        - ADJUSTMENT_OUT
        - SALE_ISSUE
        - SALES_RETURN_IN
        - PURCHASE_RECEIPT
        - VENDOR_RETURN_OUT
        - SCRAP_OUT
        - REVERSAL
      description: >
        Posted sign: positive for IN/receipt types (OPENING_BALANCE,
        ADJUSTMENT_IN, SALES_RETURN_IN, PURCHASE_RECEIPT) and negative for
        ISSUE/OUT types (SALE_ISSUE, VENDOR_RETURN_OUT, SCRAP_OUT,
        ADJUSTMENT_OUT). Reversal exactly negates its original.

    InventoryTxnStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]
      description: POSTED rows/lines immutable; CANCELLED only for unposted drafts.

    InventoryTxnLineDto:
      type: object
      required: [inventory_txn_line_id, product_id, location_id, batch_id, product_uom_id, entered_qty, conversion_snapshot, quantity_delta_base]
      properties:
        inventory_txn_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        location_id: { $ref: "#/components/schemas/Uuid" }
        batch_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Product's base UOM for ledger lines.
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        conversion_snapshot: { $ref: "#/components/schemas/PositiveNumeric6" }
        quantity_delta_base:
          allOf:
            - $ref: "#/components/schemas/Numeric4"
          description: Signed non-zero base-quantity delta; never 0.
        unit_cost_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
        sales_order_line_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        sales_return_line_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        purchase_order_line_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        vendor_return_line_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true

    InventoryTxnDto:
      type: object
      required: [inventory_txn_id, branch_id, transaction_no, transaction_type, status, lines]
      properties:
        inventory_txn_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        transaction_no: { type: string, maxLength: 40 }
        transaction_type: { $ref: "#/components/schemas/InventoryTxnType" }
        status: { $ref: "#/components/schemas/InventoryTxnStatus" }
        reason_code: { type: string, nullable: true, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }
        posted_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        created_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        reverses_inventory_txn_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        sales_order_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        sales_return_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        purchase_order_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        vendor_return_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        lines:
          type: array
          items: { $ref: "#/components/schemas/InventoryTxnLineDto" }

    InventoryTxnRequest:
      type: object
      required: [transaction_type, branch_id, reason_code, lines]
      properties:
        transaction_type:
          type: string
          enum: [OPENING_BALANCE, ADJUSTMENT_IN, ADJUSTMENT_OUT, REVERSAL]
          description: |
            Adjustment endpoint only. Ledger-generated types (SALE_ISSUE,
            SALES_RETURN_IN, PURCHASE_RECEIPT, VENDOR_RETURN_OUT, SCRAP_OUT)
            are server-created by their owning workflows and cannot be posted
            here.
        branch_id: { $ref: "#/components/schemas/Uuid" }
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }
        reverses_inventory_txn_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
          description: Required when transaction_type=REVERSAL; must reference a POSTED transaction in the same branch.
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryTxnLineRequest" }

    InventoryTxnPatchRequest:
      type: object
      description: |
        Partial edit for a DRAFT adjustment only. transaction_type, branch_id,
        and reverses_inventory_txn_id are immutable after creation. Posted
        transactions are immutable and must be corrected by a new REVERSAL.
      properties:
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InventoryTxnLineRequest" }

    InventoryTxnLineRequest:
      type: object
      required: [product_id, location_id, batch_id, entered_qty, product_uom_id]
      properties:
        product_id: { $ref: "#/components/schemas/Uuid" }
        location_id: { $ref: "#/components/schemas/Uuid" }
        batch_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: >-
            For non-lot-tracked products use the system NON-LOT batch row.
        product_uom_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Typically the product's base UOM; conversion must be >0.
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        unit_cost_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          nullable: true
          description: >
            Required for ADJUSTMENT_IN / OPENING_BALANCE; server uses current
            balance cost for ADJUSTMENT_OUT and reversals; never negative.

    # -------------------------------------------------------------------------
    # Sales (Stage 2, BranchLocal)
    # -------------------------------------------------------------------------
    SalesOrderStatus:
      type: string
      enum: [DRAFT, COMPLETED, CANCELLED]

    SalesOrderLineDto:
      type: object
      required: [order_line_id, product_id, product_uom_id, entered_qty, conversion_snapshot, quantity_base, unit_price_snapshot, discount_amount, tax_rate_snapshot, tax_amount_snapshot, line_total]
      properties:
        order_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        conversion_snapshot: { $ref: "#/components/schemas/PositiveNumeric6" }
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        unit_price_snapshot: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        discount_amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: Always 0 for MVP
        tax_rate_snapshot: { $ref: "#/components/schemas/TaxRate" }
        tax_amount_snapshot: { $ref: "#/components/schemas/Money" }
        line_total: { $ref: "#/components/schemas/Money" }

    SalesOrderDto:
      type: object
      required: [sales_order_id, branch_id, created_by_employee_id, order_no, channel, order_status, currency_code, created_at, lines]
      properties:
        sales_order_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        created_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        order_no: { type: string }
        channel: { type: string, default: "POS" }
        order_status: { $ref: "#/components/schemas/SalesOrderStatus" }
        currency_code: { type: string, description: equals Organization base_currency }
        estimated_subtotal: { $ref: "#/components/schemas/Money" }
        estimated_tax_total: { $ref: "#/components/schemas/Money" }
        estimated_grand_total: { $ref: "#/components/schemas/Money" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        completed_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        lines:
          type: array
          items: { $ref: "#/components/schemas/SalesOrderLineDto" }

    CreateSalesOrderRequest:
      type: object
      required: [branch_id, lines]
      description: |
        FE provides only product identification and quantity. Price, tax,
        discount, and totals are server-calculated from PRODUCT_UOM and
        PRODUCT tax baselines — never authoritative from the FE.
      properties:
        branch_id: { $ref: "#/components/schemas/Uuid" }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SalesOrderLineRequest" }

    SalesOrderLineRequest:
      type: object
      required: [product_id, product_uom_id, entered_qty]
      properties:
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }

    SalesOrderLinesRequest:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SalesOrderLineRequest" }

    CompleteSalesOrderRequest:
      type: object
      required: [cash_tendered_amount, method]
      description: |
        Server recomputes totals from line snapshots. Must satisfy
        cash_tendered >= payable amount; change = tendered - due >= 0.
        Cashier full payment only; partial/credit rejected.
      properties:
        cash_tendered_amount: { $ref: "#/components/schemas/PositiveMoney" }
        method:
          type: string
          enum: [CASH]

    CompleteSalesOrderResultDto:
      type: object
      required: [sales_order, invoice, payment, inventory_txn]
      properties:
        sales_order: { $ref: "#/components/schemas/SalesOrderDto" }
        invoice: { $ref: "#/components/schemas/SalesInvoiceDto" }
        payment:
          $ref: "#/components/schemas/SalesPaymentDto"
        inventory_txn:
          $ref: "#/components/schemas/InventoryTxnDto"

    SalesInvoiceStatus:
      type: string
      enum: [ISSUED]

    SalesInvoicePaymentStatus:
      type: string
      enum: [PAID, PARTIALLY_REFUNDED, REFUNDED]

    SalesInvoiceLineDto:
      type: object
      required: [invoice_line_id, source_order_line_id, product_id, product_uom_id, entered_qty, conversion_snapshot, quantity_base, unit_price_snapshot, discount_amount, tax_rate_snapshot, tax_amount_snapshot, net_amount, line_total, unit_cost_snapshot]
      properties:
        invoice_line_id: { $ref: "#/components/schemas/Uuid" }
        source_order_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        conversion_snapshot: { $ref: "#/components/schemas/PositiveNumeric6" }
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        unit_price_snapshot: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        discount_amount: { $ref: "#/components/schemas/Money" }
        tax_rate_snapshot: { $ref: "#/components/schemas/TaxRate" }
        tax_amount_snapshot: { $ref: "#/components/schemas/Money" }
        net_amount: { $ref: "#/components/schemas/Money" }
        line_total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: tax-inclusive
        unit_cost_snapshot: { $ref: "#/components/schemas/NonNegativeNumeric4" }

    SalesInvoiceDto:
      type: object
      required: [invoice_id, sales_order_id, branch_id, invoice_no, status, currency_code, subtotal, discount_total, tax_total, grand_total, paid_amount, refunded_amount, payment_status, issued_at, lines]
      properties:
        invoice_id: { $ref: "#/components/schemas/Uuid" }
        sales_order_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        invoice_no: { type: string, maxLength: 40 }
        status: { $ref: "#/components/schemas/SalesInvoiceStatus" }
        currency_code: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        discount_total: { $ref: "#/components/schemas/Money" }
        tax_total: { $ref: "#/components/schemas/Money" }
        grand_total: { $ref: "#/components/schemas/Money" }
        paid_amount: { $ref: "#/components/schemas/Money" }
        refunded_amount: { $ref: "#/components/schemas/Money" }
        payment_status: { $ref: "#/components/schemas/SalesInvoicePaymentStatus" }
        issued_at: { $ref: "#/components/schemas/Timestamp" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SalesInvoiceLineDto" }
        payments:
          type: array
          description: Linked cash payments
          items: { $ref: "#/components/schemas/SalesPaymentDto" }
        returns_summary:
          type: array
          items: { $ref: "#/components/schemas/SalesReturnDto" }

    SalesPaymentDto:
      type: object
      required: [payment_id, invoice_id, amount_due, cash_tendered_amount, change_amount, method, received_by_employee_id, paid_at]
      properties:
        payment_id: { $ref: "#/components/schemas/Uuid" }
        invoice_id: { $ref: "#/components/schemas/Uuid" }
        amount_due: { $ref: "#/components/schemas/Money" }
        cash_tendered_amount: { $ref: "#/components/schemas/Money" }
        change_amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [CASH] }
        received_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        paid_at: { $ref: "#/components/schemas/Timestamp" }

    ReturnDisposition:
      type: string
      enum: [RESTOCK, QUARANTINE, SCRAP]

    SalesReturnStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]

    SalesRefundStatus:
      type: string
      enum: [NOT_REFUNDED, PARTIALLY_REFUNDED, REFUNDED]

    SalesReturnLineDto:
      type: object
      required: [return_line_id, invoice_line_id, product_id, batch_id, destination_location_id, quantity_base, refund_amount, disposition]
      properties:
        return_line_id: { $ref: "#/components/schemas/Uuid" }
        invoice_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        batch_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Server-derived from original sale
        destination_location_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Server-selected; callers do not choose.
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        refund_amount: { $ref: "#/components/schemas/Money" }
        disposition: { $ref: "#/components/schemas/ReturnDisposition" }

    SalesReturnDto:
      type: object
      required: [reason_code]
      properties:
        return_id: { $ref: "#/components/schemas/Uuid" }
        invoice_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        return_no: { type: string, maxLength: 40 }
        status: { $ref: "#/components/schemas/SalesReturnStatus" }
        reason_code: { type: string, maxLength: 40 }
        refund_amount: { $ref: "#/components/schemas/Money" }
        refund_status: { $ref: "#/components/schemas/SalesRefundStatus" }
        received_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        approved_by_employee_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
        received_at: { $ref: "#/components/schemas/Timestamp" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/SalesReturnLineDto" }
        inventory_txns:
          type: array
          maxItems: 2
          description: |
            Zero transactions for a non-restocking return, one SALES_RETURN_IN
            when stock is restocked/quarantined, and up to two when RESTOCK
            plus an additional SCRAP_OUT is required. Server-created only.
          items: { $ref: "#/components/schemas/InventoryTxnDto" }
        refund:
          $ref: "#/components/schemas/SalesRefundDto"

    SalesRefundDto:
      type: object
      required: [refund_id, sales_return_id, invoice_id, amount, method, processed_by_employee_id, refunded_at]
      properties:
        refund_id: { $ref: "#/components/schemas/Uuid" }
        sales_return_id: { $ref: "#/components/schemas/Uuid" }
        invoice_id: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [CASH] }
        processed_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        refunded_at: { $ref: "#/components/schemas/Timestamp" }

    SalesReturnRequest:
      type: object
      required: [invoice_id, reason_code, lines]
      properties:
        invoice_id: { $ref: "#/components/schemas/Uuid" }
        reason_code: { type: string, maxLength: 40 }
        approved_by_employee_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          nullable: true
          description: |
            Optional; if supplied, must be a different active Admin/Pharmacist
            with authorization at the invoice branch, and not the cashier.
            When omitted, server records pending/posted per backend policy.
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/SalesReturnLineRequest" }
        refund_requested:
          type: boolean
          default: true

    SalesReturnLineRequest:
      type: object
      required: [invoice_line_id, quantity_base, disposition]
      properties:
        invoice_line_id: { $ref: "#/components/schemas/Uuid" }
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        disposition: { $ref: "#/components/schemas/ReturnDisposition" }

    # -------------------------------------------------------------------------
    # Purchasing (Stage 3)
    # -------------------------------------------------------------------------
    SupplierDto:
      type: object
      required: [supplier_id, supplier_code, legal_name, default_lead_time_days, is_active]
      properties:
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        supplier_code: { type: string, maxLength: 30 }
        legal_name: { type: string, maxLength: 180 }
        tax_registration_number: { type: string, nullable: true, maxLength: 60 }
        contact_email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        address: { $ref: "#/components/schemas/AddressDto" }
        default_lead_time_days: { type: integer, minimum: 0 }
        is_active: { type: boolean }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    CreateSupplierRequest:
      type: object
      required: [supplier_code, legal_name, address]
      properties:
        supplier_code: { type: string, maxLength: 30 }
        legal_name: { type: string, maxLength: 180 }
        tax_registration_number: { type: string, nullable: true, maxLength: 60 }
        contact_email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        address: { $ref: "#/components/schemas/AddressDto" }
        default_lead_time_days: { type: integer, default: 0, minimum: 0 }
        is_active: { type: boolean, default: true }

    SupplierPatchRequest:
      type: object
      properties:
        legal_name: { type: string, maxLength: 180 }
        tax_registration_number: { type: string, nullable: true, maxLength: 60 }
        contact_email: { type: string, nullable: true, format: email, maxLength: 254 }
        phone: { type: string, nullable: true, maxLength: 30 }
        address: { $ref: "#/components/schemas/AddressDto" }
        default_lead_time_days: { type: integer, minimum: 0 }

    SupplierStatusPatchRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    PurchaseOrderStatus:
      type: string
      enum: [DRAFT, APPROVED, ORDERED, PARTIALLY_RECEIVED, RECEIVED, CLOSED, CANCELLED]

    PurchaseOrderPaymentStatus:
      type: string
      enum: [UNPAID, PARTIALLY_PAID, PAID]

    PurchaseOrderLineDto:
      type: object
      required: [po_line_id, product_id, product_uom_id, entered_ordered_qty, conversion_snapshot, ordered_qty_base, received_qty_base, rejected_qty_base, cancelled_qty_base, unit_cost_entered, unit_cost_base, discount_amount, tax_rate_snapshot, tax_amount, line_total, allocated_additional_cost, min_remaining_shelf_days]
      properties:
        po_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_ordered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        conversion_snapshot: { $ref: "#/components/schemas/PositiveNumeric6" }
        ordered_qty_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        received_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: cumulative accepted quantity only (rejected excluded)
        rejected_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        cancelled_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        remaining_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          readOnly: true
          description: ordered - accepted - cancelled
        unit_cost_entered: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        unit_cost_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        discount_amount: { $ref: "#/components/schemas/Money" }
        tax_rate_snapshot: { $ref: "#/components/schemas/TaxRate" }
        tax_amount: { $ref: "#/components/schemas/Money" }
        line_total:
          allOf:
            - $ref: "#/components/schemas/Money"
          description: "line net, tax-exclusive"
        allocated_additional_cost: { $ref: "#/components/schemas/Money" }
        min_remaining_shelf_days: { type: integer, minimum: 0, default: 90 }

    PurchaseOrderDto:
      type: object
      required: [purchase_order_id, po_no, supplier_id, branch_id, created_by_employee_id, status, currency_code, subtotal, tax_total, additional_costs, total_amount, paid_amount, payment_status, lines]
      properties:
        purchase_order_id: { $ref: "#/components/schemas/Uuid" }
        po_no: { type: string, maxLength: 40 }
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        created_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        expected_on: { type: string, format: date, nullable: true }
        currency_code: { type: string }
        subtotal: { $ref: "#/components/schemas/Money" }
        tax_total: { $ref: "#/components/schemas/Money" }
        additional_costs: { $ref: "#/components/schemas/Money" }
        total_amount: { $ref: "#/components/schemas/Money" }
        paid_amount: { $ref: "#/components/schemas/Money" }
        outstanding_amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          readOnly: true
          description: total - paid
        payment_status: { $ref: "#/components/schemas/PurchaseOrderPaymentStatus" }
        ordered_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLineDto" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }

    PurchaseOrderLineRequest:
      type: object
      required: [product_id, product_uom_id, entered_ordered_qty, unit_cost_entered]
      properties:
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_ordered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        unit_cost_entered: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        discount_amount:
          allOf:
            - $ref: "#/components/schemas/Money"
          default: "0.00"
        tax_rate_snapshot:
          allOf:
            - $ref: "#/components/schemas/TaxRate"
          nullable: true
          description: Defaults to PRODUCT.tax_rate at server
        min_remaining_shelf_days: { type: integer, minimum: 0, default: 90 }

    CreatePurchaseOrderRequest:
      type: object
      required: [supplier_id, branch_id, currency_code, lines]
      properties:
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        expected_on: { type: string, format: date, nullable: true }
        currency_code: { type: string, description: must equal organization base_currency }
        additional_costs:
          description: Optional header additional cost, pro-rata allocated to lines at creation.
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PurchaseOrderLineRequest" }

    PurchaseOrderPatchRequest:
      type: object
      description: DRAFT-only edit
      properties:
        expected_on: { type: string, format: date, nullable: true }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PurchaseOrderLineRequest" }

    CancelPurchaseOrderRequest:
      type: object
      required: [reason_code]
      properties:
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }

    CancelPurchaseOrderRemainingRequest:
      type: object
      required: [reason_code]
      description: |
        BranchLocal-only cancellation of the PO's remaining uncancelled
        quantity. On success when no uncancelled quantity remains, the PO
        transitions to CLOSED and a CANCEL_REMAINING_PURCHASE_ORDER fact
        synchronizes to cloud.
      properties:
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }

    OrderPurchaseOrderRequest:
      type: object
      description: Empty request; marks ordered/sent.
      properties: {}

    ReceivePurchaseOrderRequest:
      type: object
      required: [location_id, received_on, lines]
      properties:
        location_id: { $ref: "#/components/schemas/Uuid" }
        received_on: { type: string, format: date }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ReceiveLineRequest" }

    ReceiveLineRequest:
      type: object
      required: [po_line_id, product_id, product_uom_id, entered_qty, batch_number]
      description: |
        Quantities are entered in `product_uom_id`; the server normalizes them
        to base UOM. `entered_accepted_qty` defaults to `entered_qty` and
        `entered_rejected_qty` defaults to 0. If normalized `*_qty_base`
        fields are supplied, the server validates that they match the entered
        quantities and the equation received = accepted + rejected.
        Accepted quantity accumulates to PO received_qty_base; rejected
        quantity stays replaceable/cancellable; batch supplied per line.
      properties:
        po_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id:
          allOf:
            - $ref: "#/components/schemas/Uuid"
          description: Entered UOM for the entered_* quantity fields.
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        entered_accepted_qty: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        entered_rejected_qty: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        received_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: Optional client echo of normalized accepted + rejected; server-computed when omitted.
        accepted_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: Optional client echo of normalized accepted quantity; server-computed when omitted.
        rejected_qty_base:
          allOf:
            - $ref: "#/components/schemas/NonNegativeNumeric4"
          description: Optional client echo of normalized rejected quantity; server-computed when omitted.
        batch_number: { type: string, maxLength: 80, nullable: false }
        manufactured_on: { type: string, format: date, nullable: true }
        expires_on: { type: string, format: date, nullable: true }
        override_reason:
          type: string
          nullable: true
          description: Required for authorized shelf-life exception.

    ReceiveLineDto:
      type: object
      required: [po_line_id, product_id, product_uom_id, entered_qty, entered_accepted_qty, entered_rejected_qty, received_qty_base, accepted_qty_base, rejected_qty_base, remaining_qty_base, batch_id]
      properties:
        po_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        product_uom_id: { $ref: "#/components/schemas/Uuid" }
        entered_qty: { $ref: "#/components/schemas/PositiveNumeric4" }
        entered_accepted_qty: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        entered_rejected_qty: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        received_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        accepted_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        rejected_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        remaining_qty_base: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        batch_id: { $ref: "#/components/schemas/Uuid" }

    PurchaseReceiptResultDto:
      type: object
      required: [inventory_txn_id, purchase_order_status, lines]
      properties:
        inventory_txn_id: { $ref: "#/components/schemas/Uuid" }
        purchase_order_status: { $ref: "#/components/schemas/PurchaseOrderStatus" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/ReceiveLineDto" }
        trace_id: { type: string }

    RecordSupplierPaymentRequest:
      type: object
      required: [supplier_id, purchase_order_id, amount, currency_code, method]
      description: |
        Posts a SupplierPayment and updates PO paid_amount / payment_status
        atomically in the same transaction. Currency must match PO.
      properties:
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        purchase_order_id: { $ref: "#/components/schemas/Uuid" }
        amount:
          allOf:
            - $ref: "#/components/schemas/PositiveMoney"
          description: Must be >0 and <= outstanding PO balance
        currency_code: { type: string }
        method: { type: string, enum: [CASH] }
        payment_reference: { type: string, nullable: true, maxLength: 100 }
        note: { type: string, nullable: true, maxLength: 250 }

    SupplierPaymentDto:
      type: object
      required: [supplier_payment_id, supplier_id, purchase_order_id, amount, currency_code, method, paid_at, recorded_by_employee_id]
      properties:
        supplier_payment_id: { $ref: "#/components/schemas/Uuid" }
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        purchase_order_id: { $ref: "#/components/schemas/Uuid" }
        amount: { $ref: "#/components/schemas/Money" }
        currency_code: { type: string }
        method: { type: string, enum: [CASH] }
        payment_reference: { type: string, nullable: true }
        note: { type: string, nullable: true }
        paid_at: { $ref: "#/components/schemas/Timestamp" }
        recorded_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        po_paid_amount: { $ref: "#/components/schemas/Money" }
        po_outstanding_amount: { $ref: "#/components/schemas/Money" }
        po_payment_status: { $ref: "#/components/schemas/PurchaseOrderPaymentStatus" }

    VendorReturnStatus:
      type: string
      enum: [DRAFT, POSTED, CANCELLED]

    VendorReturnLineDto:
      type: object
      required: [vendor_return_line_id, purchase_order_line_id, product_id, batch_id, location_id, quantity_base, unit_cost_snapshot]
      properties:
        vendor_return_line_id: { $ref: "#/components/schemas/Uuid" }
        purchase_order_line_id: { $ref: "#/components/schemas/Uuid" }
        product_id: { $ref: "#/components/schemas/Uuid" }
        batch_id: { $ref: "#/components/schemas/Uuid" }
        location_id: { $ref: "#/components/schemas/Uuid" }
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        unit_cost_snapshot: { $ref: "#/components/schemas/NonNegativeNumeric4" }
        reason_code: { type: string, maxLength: 40 }

    VendorReturnDto:
      type: object
      required: [vendor_return_id, return_no, supplier_id, branch_id, created_by_employee_id, status, created_at, lines]
      properties:
        vendor_return_id: { $ref: "#/components/schemas/Uuid" }
        return_no: { type: string, maxLength: 40 }
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        created_by_employee_id: { $ref: "#/components/schemas/Uuid" }
        status: { $ref: "#/components/schemas/VendorReturnStatus" }
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        posted_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        lines:
          type: array
          items: { $ref: "#/components/schemas/VendorReturnLineDto" }
        inventory_txn:
          allOf:
            - $ref: "#/components/schemas/InventoryTxnDto"
          nullable: true

    CreateVendorReturnRequest:
      type: object
      required: [supplier_id, branch_id, reason_code, lines]
      properties:
        supplier_id: { $ref: "#/components/schemas/Uuid" }
        branch_id: { $ref: "#/components/schemas/Uuid" }
        reason_code: { type: string, maxLength: 40 }
        note: { type: string, nullable: true, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/VendorReturnLineRequest" }

    VendorReturnLineRequest:
      type: object
      required: [purchase_order_line_id, batch_id, location_id, quantity_base, reason_code]
      properties:
        purchase_order_line_id: { $ref: "#/components/schemas/Uuid" }
        batch_id: { $ref: "#/components/schemas/Uuid" }
        location_id: { $ref: "#/components/schemas/Uuid" }
        quantity_base: { $ref: "#/components/schemas/PositiveNumeric4" }
        reason_code: { type: string, maxLength: 40 }

